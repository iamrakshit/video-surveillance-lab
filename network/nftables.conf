#!/usr/sbin/nft -f
# Gateway firewall for the surveillance lab (Linux router, nftables).
# Interfaces: wan0 = internet, lan.10 = management, lan.20 = servers (NVR), lan.30 = cameras,
#             lan.40 = staff, wg0 = WireGuard remote access.
# Principle: cameras talk only to the NVR; nobody reaches cameras from the internet; remote viewers reach
# only the Frigate UI, through WireGuard. No port forwarding anywhere.
# Check before loading:  nft -c -f network/nftables.conf      Load:  nft -f network/nftables.conf

flush ruleset

define NVR      = 10.20.0.10
define CAMERAS  = 10.30.0.0/24
define WG_NET   = 10.99.0.0/24

table inet filter {
    chain input {                                   # traffic to the gateway itself
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept
        meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
        iifname "wan0" udp dport 51820 accept comment "WireGuard: the only open port on the internet side"
        iifname "lan.10" tcp dport 22 accept comment "SSH to the gateway from management only"
        iifname "lan.30" udp dport { 67, 123 } accept comment "cameras: DHCP and NTP from the gateway, nothing else"
        iifname { "lan.10", "lan.20", "lan.40", "wg0" } udp dport { 53, 67, 123 } accept
        iifname { "lan.10", "lan.20", "lan.40", "wg0" } tcp dport 53 accept
        limit rate 5/second log prefix "GW-DROP " level info
    }

    chain forward {                                 # traffic between VLANs and to the internet
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop

        # NVR pulls video from cameras (RTSP) and talks ONVIF/HTTP for PTZ and time sync
        ip saddr $NVR ip daddr $CAMERAS tcp dport { 80, 554 } accept comment "NVR -> cameras"

        # Camera configuration from the management VLAN only
        iifname "lan.10" ip daddr $CAMERAS tcp dport { 80, 443 } accept comment "admin -> camera web UI"

        # Viewing: staff VLAN and WireGuard users reach only Frigate's authenticated port
        iifname { "lan.40", "wg0" } ip daddr $NVR tcp dport 8971 accept comment "viewers -> Frigate UI"
        iifname "lan.10" ip daddr $NVR tcp dport { 22, 8971 } accept comment "admin -> NVR"

        # Internet access for everything except cameras
        iifname { "lan.10", "lan.20", "lan.40" } oifname "wan0" accept

        # Cameras: anything else (internet, other VLANs, cloud/P2P services) is dropped and logged
        iifname "lan.30" limit rate 10/second log prefix "CAM-DROP " level info
        iifname "lan.30" drop

        limit rate 5/second log prefix "FWD-DROP " level info
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "wan0" masquerade
    }
}
